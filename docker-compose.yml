services:
  db:
    image: postgres:16-alpine
    container_name: azatech-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: azatech
      POSTGRES_USER: azatech
      POSTGRES_PASSWORD: azatech
    ports:
      - "5432:5432"
    volumes:
      - azatech-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U azatech -d azatech"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: azatech-backend
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://azatech:azatech@db:5432/azatech?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-replace-with-a-long-random-value}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-replace-with-another-long-random-value}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-replace-with-a-local-admin-password}
    ports:
      - "${BACKEND_HOST_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    container_name: azatech-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  azatech-postgres-data:
