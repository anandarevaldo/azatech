openapi: 3.0.3
info:
  title: Azatech Online Shop API
  version: 1.0.0
  description: REST API untuk technical test Medior Fullstack Developer.
servers:
  - url: http://localhost:3001/api
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      security: []
      summary: Login admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Token access dan refresh
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthLoginResponse' }
        '401': { description: Credential salah }
  /auth/me:
    get:
      summary: Profil user aktif
      responses:
        '200':
          description: Profil user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { description: Token tidak valid }
  /auth/refresh:
    post:
      security: []
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: Access token baru
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthRefreshResponse' }
        '401': { description: Refresh token tidak valid }
  /auth/logout:
    post:
      summary: Revoke refresh token
      responses:
        '204': { description: Berhasil logout }
  /products:
    get:
      summary: List produk dengan pagination/search/sort
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
        - { name: search, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [name, price, stock] } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - { name: stock_status, in: query, schema: { type: string, enum: [all, available, low, out], default: all } }
      responses: { '200': { description: Daftar produk } }
    post:
      summary: Tambah produk
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductRequest' }
      responses: { '201': { description: Produk dibuat }, '422': { description: Validasi gagal } }
  /products/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get: { summary: Detail produk, responses: { '200': { description: Produk }, '404': { description: Tidak ditemukan } } }
    put:
      summary: Update produk
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductRequest' }
      responses: { '200': { description: Produk diperbarui } }
    delete: { summary: Soft delete produk, responses: { '204': { description: Berhasil dihapus } } }
  /customers:
    get:
      summary: List customer
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
        - { name: search, in: query, schema: { type: string } }
        - { name: gender, in: query, schema: { type: string, enum: [PRIA, WANITA] } }
      responses: { '200': { description: Daftar customer } }
    post: { summary: Tambah customer, responses: { '201': { description: Customer dibuat } } }
  /customers/{id}:
    parameters: [{ $ref: '#/components/parameters/Uuid' }]
    get: { summary: Detail customer, responses: { '200': { description: Customer } } }
    put: { summary: Update customer, responses: { '200': { description: Customer diperbarui } } }
    delete: { summary: Soft delete customer, responses: { '204': { description: Berhasil dihapus } } }
  /orders:
    get:
      summary: Riwayat order
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: customer_id, in: query, schema: { type: string, format: uuid } }
        - { name: search, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses: { '200': { description: Daftar order } }
    post:
      summary: Buat order dan kurangi stok secara atomik
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderRequest' }
      responses:
        '201': { description: Order berhasil dibuat }
        '422': { description: Stok tidak mencukupi atau input invalid }
  /orders/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get: { summary: Detail order, responses: { '200': { description: Detail order } } }
  /dashboard/summary:
    get: { summary: Ringkasan dashboard, responses: { '200': { description: Summary transaksi dan stok } } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer } }
    Uuid: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PerPage: { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
  schemas:
    AuthLoginResponse:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Login berhasil }
        data:
          type: object
          required: [access_token, refresh_token, user]
          properties:
            access_token: { type: string }
            refresh_token: { type: string }
            user: { $ref: '#/components/schemas/User' }
    AuthRefreshResponse:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Token berhasil diperbarui }
        data:
          type: object
          required: [access_token]
          properties:
            access_token: { type: string }
    UserResponse:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: OK }
        data: { $ref: '#/components/schemas/User' }
    User:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    ProductRequest:
      type: object
      required: [product_code, product_name, stock, price]
      properties:
        product_code: { type: string, maxLength: 20 }
        product_name: { type: string, maxLength: 150 }
        stock: { type: integer, minimum: 0 }
        price: { type: number, minimum: 0.01 }
    OrderRequest:
      type: object
      required: [customer_id, items]
      properties:
        customer_id: { type: string, format: uuid }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id: { type: integer }
              quantity: { type: integer, minimum: 1 }
    ErrorResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, example: false }
        message: { type: string, example: Validasi gagal }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
